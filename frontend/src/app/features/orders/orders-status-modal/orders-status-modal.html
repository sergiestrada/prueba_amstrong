<div class="modal-backdrop" (click)="cancel()">
  <div class="modal-panel" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
    <header class="modal-header">
      <div>
        <h3>Cambiar estatus</h3>
        <p class="muted small">
          Orden <strong>{{ order.folio }}</strong> · Estado actual:
          <strong>{{ statusLabel(order.status) }}</strong>
        </p>
      </div>
      <button class="icon-close" (click)="cancel()" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </header>

    <div class="error-banner" *ngIf="errorMessage() as e">{{ e }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label>Nuevo estatus *</label>
        <div class="options">
          <label class="option"
                 *ngFor="let t of order.transiciones_disponibles"
                 [class.selected]="form.controls.status.value === t">
            <input type="radio" formControlName="status" [value]="t">
            <span class="option-label">{{ statusLabel(t) }}</span>
          </label>
        </div>
      </div>

      <div class="field" *ngIf="isComplete()">
        <label for="costo_real">Costo real (MXN)</label>
        <input id="costo_real" type="number" min="0" step="0.01"
               formControlName="costo_real" placeholder="0.00">
        <small class="hint">Opcional. Se guardará al cerrar la orden.</small>
      </div>

      <div class="field">
        <label for="notas">Notas (opcional)</label>
        <textarea id="notas" rows="3" formControlName="notas"
                  placeholder="Agrega un comentario al cambio de estatus…"></textarea>
        <small class="hint">
          El cambio se registrará con la fecha y el nuevo estatus al inicio de la nota.
        </small>
      </div>

      <footer class="modal-actions">
        <button type="button" class="btn-ghost" (click)="cancel()" [disabled]="submitting()">
          Cancelar
        </button>
        <button type="submit" class="btn-primary" [disabled]="submitting() || !form.controls.status.value">
          {{ submitting() ? 'Guardando…' : 'Confirmar cambio' }}
        </button>
      </footer>
    </form>
  </div>
</div>
